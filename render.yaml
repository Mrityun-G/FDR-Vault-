# Render Blueprint: the API server (Node.js + Express) and its PostgreSQL database.
# Render → New → Blueprint → this repository. Then fill in the "sync: false" values in the service's Environment tab.
# The front ends stay on Vercel: set AICTE_API_URL (institution app) and VITE_API_URL (staff portal) to this service's URL.
services:
  - type: web
    name: fdr-vault-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    # Applies new migrations on every deploy. On an EMPTY database it also creates the 4 demo accounts and an empty
    # DITS Delhi (seed + reset-test-data); on a database with data it never seeds or deletes anything.
    startCommand: node server/migrate.mjs --seed --reset-test-data && node server/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: fdr-vault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Daily FDR maturity reminders (07:00 IST). Safe on several instances: the database lets one run per day.
      # The free plan sleeps when idle; .github/workflows/wake-api.yml wakes it after 07:00 IST so the day's run happens.
      - key: RUN_SCHEDULER
        value: "true"
      - key: PUBLIC_URL
        sync: false            # e.g. https://fdr-vault-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://fdr-vault.vercel.app,https://fdr-vault-sbf7.vercel.app,https://localhost
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: fdr-vault-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
